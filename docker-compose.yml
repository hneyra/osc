version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: osc
      POSTGRES_USER: osc
      POSTGRES_PASSWORD: osc_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osc -d osc"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/osc
      SPRING_R2DBC_USERNAME: osc
      SPRING_R2DBC_PASSWORD: osc_dev_password
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/osc
      SPRING_FLYWAY_USER: osc
      SPRING_FLYWAY_PASSWORD: osc_dev_password
      SPRING_PROFILES_ACTIVE: default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
