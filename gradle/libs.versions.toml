[versions]
spring-boot                 = "4.0.0"
spring-ai                   = "2.0.0-M6"
spring-dependency-management = "1.1.7"
testcontainers              = "1.20.4"
caffeine                    = "3.2.0"
archunit                    = "1.4.0"

[libraries]
# Spring Boot starters — versions managed by Spring Boot BOM
spring-boot-starter-webflux        = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-data-r2dbc     = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }
spring-boot-starter-actuator       = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test           = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-autoconfigure          = { module = "org.springframework.boot:spring-boot-autoconfigure" }

# Spring AI — versions managed by Spring AI BOM
spring-ai-openai-spring-boot-starter = { module = "org.springframework.ai:spring-ai-openai-spring-boot-starter" }

# Reactor — versions managed by Spring Boot BOM
reactor-core = { module = "io.projectreactor:reactor-core" }
reactor-test = { module = "io.projectreactor:reactor-test" }

# Database — versions managed by Spring Boot BOM
r2dbc-postgresql         = { module = "org.postgresql:r2dbc-postgresql" }
postgresql               = { module = "org.postgresql:postgresql" }
flyway-core              = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# Cache
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

# Testcontainers — versions managed by Testcontainers BOM
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql    = { module = "org.testcontainers:postgresql" }
testcontainers-r2dbc         = { module = "org.testcontainers:r2dbc" }

# ArchUnit
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[bundles]
testcontainers = ["testcontainers-junit-jupiter", "testcontainers-postgresql", "testcontainers-r2dbc"]

[plugins]
spring-boot                = { id = "org.springframework.boot",         version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
