# AWS profile — active when SPRING_PROFILES_ACTIVE includes "aws" or "prod"
# Database credentials are loaded from AWS Secrets Manager by DatabaseSecretsRefresher.
# The placeholder values below are overridden at startup by the refresher.

osc.aws.secrets-manager.enabled=true
osc.aws.secrets-manager.db-secret-name=${OSC_DB_SECRET_NAME:osc-db-secret}
osc.aws.secrets-manager.refresh-interval-ms=86400000

# R2DBC and Flyway URLs are set by DatabaseSecretsRefresher from the secret;
# the values below act as safe fallback placeholders (will be overridden).
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/osc
spring.r2dbc.username=placeholder
spring.r2dbc.password=placeholder
spring.flyway.url=jdbc:postgresql://localhost:5432/osc
spring.flyway.user=placeholder
spring.flyway.password=placeholder
