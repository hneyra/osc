spring:
  application:
    name: osc
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/osc
    username: osc
    password: osc_dev_password
  flyway:
    url: jdbc:postgresql://localhost:5432/osc
    user: osc
    password: osc_dev_password
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    metrics:
      enabled: true

osc:
  rate-limit:
    requests-per-minute: 1000
  metadata:
    cache:
      expire-after-write: 10m
      maximum-size: 10000
